spring.application.name=user-management

# 1. Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5434/user_management_db
spring.datasource.username=keycloak
spring.datasource.password=keycloak123
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

keycloak.realm=${KEYCLOAK_REALM:user-management-dev}
keycloak.server-url=${KEYCLOAK_SERVER_URL:https://lemur-2.cloud-iam.com/auth}
keycloak.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.username=${KEYCLOAK_ADMIN_USERNAME:}
keycloak.password=${KEYCLOAK_ADMIN_PASSWORD:}
keycloak.app-client-id=user-management-client



app.fixed-delay-ms=30000
app.delegation.check-ms=60000

#spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.server-url}/realms/${keycloak.realm}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/realms/user-management/protocol/openid-connect/certs}

# 3. Server Port
server.port=9090

springdoc.use-fqn=true

# 4. Spring Cloud Stream Kafka Binder Settings
spring.cloud.function.definition=userProvisioningConsumer

spring.cloud.stream.bindings.userProvisioningConsumer-in-0.destination=user-events
spring.cloud.stream.bindings.userProvisioningConsumer-in-0.group=user-management

spring.cloud.stream.kafka.binder.brokers=localhost:29092